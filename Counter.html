<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Counter</title>
  <link rel="stylesheet" href="Counter.css">
  <link rel="stylesheet" href="Counter.js"
</head>
<body>

  <div class="card text-center">
    <h2>Interactive Counter</h2>
    <div id="counterValue" class="big-counter">1</div>
    <div class="btn-group">
      <button id="decBtn" class="btn btn-secondary">/6</button>
      <button id="resetBtn" class="btn btn-secondary">Reset</button>
      <button id="incBtn" class="btn btn-primary">*6</button>
    </div>
    <p id="actionMsg" class="action-text">Click any button above to trigger an event</p>
  </div>

  <script src="Counter.js"></script>
</body>
</html>
